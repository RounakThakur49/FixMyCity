# Render blueprint — FixMyCity backend + ML co-running in ONE free service.
#
# WHY one service: Render Free gives 750 instance-hours/month PER WORKSPACE
# (shared). Two always-on services = ~1460 hr > 750 → one suspends mid-month.
# Co-running backend + ML in a single process fits ~730 hr/month, indefinitely.
#
# ML_INLINE=true → backend calls the ML pipeline in-process (no second service,
# no HTTP hop). DISABLE_CLIP=true → skip the 150MB CLIP model so total RAM stays
# well under the 512MB free cap (measured ~280MB peak during inference). "Others"
# category then uses keyword fallback; civic 4-class + NSFW moderation stay live.
#
# Native Node runtime (NOT Docker) → no credit card required on Render Free.
# Persistent process → no per-request timeout; slow (~25-60s) tfjs inference on
# shared CPU completes fine. Add an external uptime pinger (e.g. cron-job.org)
# hitting /api/health every ~14 min so the service never sleeps.
#
# Deploy: New → Blueprint → point at this repo. Set the secret env vars
# (sync:false) in the Render dashboard after the first deploy.
services:
  - type: web
    name: fixmycity
    runtime: node
    # IMPORTANT: root stays at the REPO ROOT (no rootDir). Render makes files
    # outside rootDir unavailable, so a subfolder rootDir would hide ml-service
    # from the in-process require. We `cd` into each folder in the commands
    # instead — the whole repo is checked out at the root.
    plan: free
    buildCommand: cd backend && npm install && cd ../ml-service && npm install --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"   # raise V8 heap ceiling; Render's
        # low default aborts (exit 134) during tfjs model load even though real
        # RSS peaks ~280MB. 460 leaves headroom under the 512MB container cap.
      - key: ML_INLINE
        value: "true"          # run ML in-process (single free service)
      - key: DISABLE_CLIP
        value: "true"          # skip CLIP → fit 512MB (Others → keyword fallback)
      - key: ML_TIMEOUT_MS
        value: "120000"        # generous; shared-CPU tfjs inference is slow
      - key: MONGO_URI
        sync: false            # set in dashboard (Atlas connection string)
      - key: JWT_SECRET
        sync: false            # set in dashboard (long random string)
      - key: CORS_ORIGIN
        sync: false            # set to your Vercel frontend URL
