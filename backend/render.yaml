# Render blueprint for the FixMyCity backend (light — no ML deps).
# Deploy: New → Blueprint → point at this repo. Set the secret env vars
# (marked sync:false) in the Render dashboard after the first deploy.
#
# Root directory must be `backend/`. The ML pipeline is a SEPARATE service
# (see ../ml-service, deployed to Hugging Face Spaces) reached via ML_SERVICE_URL.
services:
  - type: web
    name: fixmycity-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"          # Render injects PORT; this is a safe default
      - key: MONGO_URI
        sync: false             # set in dashboard (Atlas connection string)
      - key: JWT_SECRET
        sync: false             # set in dashboard (long random string)
      - key: CORS_ORIGIN
        sync: false             # set to your Vercel frontend URL
      - key: ML_SERVICE_URL
        sync: false             # set to your HF Space URL (https://<space>.hf.space)
      - key: ML_KEY
        sync: false             # must match the ML service's ML_KEY
